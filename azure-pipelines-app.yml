trigger:
  branches:
    include: [main]
  paths:
    include: [src/*]

variables:
- name: vmImageName
  value: 'ubuntu-latest'
- name: azureSubscription
  value: 'Azure-StayHere-Conn'
- name: buildConfiguration
  value: 'Release'
- name: dotnetVersion
  value: '9.x'
- group: StayHere-Variables

stages:
- stage: CheckChanges
  displayName: 'Detect Changed Services'
  jobs:
  - job: Detect
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
    - script: |
        # Force a full build/deploy if triggered manually
        if [[ "$(Build.Reason)" == "Manual" ]]; then
          echo "Manual trigger detected. Forcing full build and deployment."
          CHANGED_FILES="FORCE_ALL"
        elif git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD HEAD~1)
        else
          CHANGED_FILES="FORCE_ALL"
        fi
        
        echo "Detected Changes:"
        echo "$CHANGED_FILES"

        # Check for global changes that require full redeploy
        GLOBAL_CHANGE=false
        if [[ "$CHANGED_FILES" == "FORCE_ALL" ]] || echo "$CHANGED_FILES" | grep -E "^(src/Application/|src/Domain/|src/Infrastructure/|StayHere.sln|azure-pipelines-app.yml)"; then
          GLOBAL_CHANGE=true
          echo "Global change detected (Shared project or Pipeline config changed)."
        fi
        echo "##vso[task.setvariable variable=globalChange;isOutput=true]$GLOBAL_CHANGE"

        # Service-specific checks
        SERVICES=("AuthService" "PropertyService" "CustomerService" "PropertyOwnerService" "StaticDataService" "AiAgentService")
        for SERVICE in "${SERVICES[@]}"; do
          HAS_CHANGE=false
          if [ "$GLOBAL_CHANGE" = true ] || echo "$CHANGED_FILES" | grep -E "^src/FunctionApps/$SERVICE/"; then
            HAS_CHANGE=true
            echo "Changes detected for $SERVICE."
          fi
          echo "##vso[task.setvariable variable=change_$SERVICE;isOutput=true]$HAS_CHANGE"
        done
      name: DetectionStep
      displayName: 'Analyze Git Diffs'

- stage: Build
  displayName: 'Build and Package'
  dependsOn: CheckChanges
  jobs:
  - job: Build
    pool:
      vmImage: $(vmImageName)
    variables:
      isAuth: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_AuthService'] ]
      isProperty: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_PropertyService'] ]
      isCustomer: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_CustomerService'] ]
      isOwner: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_PropertyOwnerService'] ]
      isStatic: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_StaticDataService'] ]
      isAi: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_AiAgentService'] ]
      globalChange: $[ stageDependencies.CheckChanges.Detect.outputs['DetectionStep.globalChange'] ]
    steps:
    - task: UseDotNet@2
      inputs:
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: 'Restore Solution'
      inputs:
        command: 'restore'
        projects: 'StayHere.sln'

    - script: dotnet build StayHere.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Solution'

    - task: DotNetCoreCLI@2
      displayName: 'Publish AuthService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isAuth'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/AuthService/StayHere.AuthService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/AuthService'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish PropertyService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isProperty'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/PropertyService/StayHere.PropertyService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/PropertyService'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish CustomerService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isCustomer'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/CustomerService/StayHere.CustomerService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/CustomerService'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish PropertyOwnerService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isOwner'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/PropertyOwnerService/StayHere.PropertyOwnerService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/PropertyOwnerService'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish StaticDataService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isStatic'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/StaticDataService/StayHere.StaticDataService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/StaticDataService'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish AiAgentService'
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isAi'], 'true'), eq(variables['globalChange'], 'true')))
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/FunctionApps/AiAgentService/StayHere.AiAgentService.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/AiAgentService'
        zipAfterPublish: false

    - publish: $(Build.ArtifactStagingDirectory)/AuthService
      artifact: AuthService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isAuth'], 'true'), eq(variables['globalChange'], 'true')))
    - publish: $(Build.ArtifactStagingDirectory)/PropertyService
      artifact: PropertyService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isProperty'], 'true'), eq(variables['globalChange'], 'true')))
    - publish: $(Build.ArtifactStagingDirectory)/CustomerService
      artifact: CustomerService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isCustomer'], 'true'), eq(variables['globalChange'], 'true')))
    - publish: $(Build.ArtifactStagingDirectory)/PropertyOwnerService
      artifact: PropertyOwnerService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isOwner'], 'true'), eq(variables['globalChange'], 'true')))
    - publish: $(Build.ArtifactStagingDirectory)/StaticDataService
      artifact: StaticDataService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isStatic'], 'true'), eq(variables['globalChange'], 'true')))
    - publish: $(Build.ArtifactStagingDirectory)/AiAgentService
      artifact: AiAgentService_Pkg
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(variables['isAi'], 'true'), eq(variables['globalChange'], 'true')))

- stage: Migrate_Database
  displayName: 'Migrate Database'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Migrate
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      inputs:
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: 'Restore Infrastructure Project'
      inputs:
        command: 'restore'
        projects: 'src/Infrastructure/StayHere.Infrastructure.csproj'

    - script: dotnet build src/Infrastructure/StayHere.Infrastructure.csproj --configuration $(buildConfiguration)
      displayName: 'Build Infrastructure'

    - script: dotnet tool install --global dotnet-ef
      displayName: 'Install dotnet-ef'

    - task: AzureCLI@2
      displayName: 'Discover DB Config and Run Migrations'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Discovering Resource Group..."
          RG_NAME=$(az group list --query "[?tags.Project=='stayhere' && tags.Environment=='dev'].name" -o tsv | head -n 1)
          
          if [ -z "$RG_NAME" ]; then
            echo "Resource Group not found. Trying fallback search..."
            RG_NAME=$(az group list --query "[?contains(name, 'rg-stayhere-dev')].name" -o tsv | head -n 1)
          fi
          
          if [ -z "$RG_NAME" ]; then
            echo "##vso[task.logissue type=error]Could not find Resource Group for stayhere-dev."
            exit 1
          fi
          echo "Using Resource Group: $RG_NAME"
          
          echo "Discovering Database Configuration from Function App settings..."
          FUNC_NAME=$(az functionapp list --resource-group $RG_NAME --query "[?tags.Service=='CustomerService'].name" -o tsv | head -n 1)
          
          if [ -z "$FUNC_NAME" ]; then
            FUNC_NAME=$(az functionapp list --resource-group $RG_NAME --query "[?contains(name, 'func-dev-customer')].name" -o tsv | head -n 1)
          fi
          
          if [ -z "$FUNC_NAME" ]; then
            echo "##vso[task.logissue type=error]Could not find Customer Service Function App to extract DB config."
            exit 1
          fi
          echo "Found Reference App: $FUNC_NAME"
          
          # Extract DB settings from app settings
          SETTINGS=$(az functionapp config appsettings list --name $FUNC_NAME --resource-group $RG_NAME)
          
          export DB_HOST=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_HOST") | .value')
          export DB_PORT=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_PORT") | .value')
          export DB_NAME=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_NAME") | .value')
          export DB_USER=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_USER") | .value')
          export DB_PASSWORD=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_PASSWORD") | .value')
          export DB_SSL_MODE=$(echo $SETTINGS | jq -r '.[] | select(.name=="DB_SSL_MODE") | .value')
          
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" == "null" ]; then
             echo "##vso[task.logissue type=error]Failed to extract DB_HOST from app settings."
             exit 1
          fi
          
          echo "Successfully discovered configuration. Running migrations to $DB_HOST..."
          
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/Infrastructure \
            --verbose

- stage: Deploy_AuthService
  displayName: 'Deploy Auth'
  dependsOn: [CheckChanges, Migrate_Database]
  condition: |
    or(
      eq(variables['Build.Reason'], 'Manual'),
      and(
        succeeded(),
        or(
          eq(stageDependencies.CheckChanges.Detect.outputs['DetectionStep.change_AuthService'], 'true'),
          eq(stageDependencies.CheckChanges.Detect.outputs['DetectionStep.globalChange'], 'true')
        )
      )
    )
  jobs:
  - job: Deploy
    pool:
      vmImage: $(vmImageName)
    steps:
    - download: current
      artifact: AuthService_Pkg
    - task: AzureCLI@2
      displayName: 'Discover Function App Name'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Current Subscription Context:"
          az account show --query "{subscription:name, id:id, tenant:tenantId}" -o table
          
          echo "Audit: Listing all Function Apps in this subscription..."
          az functionapp list --query "[].{Name:name, Tags:tags}" -o table
          
          echo "Searching for Function App with Service=AuthService tag..."
          APP_NAME=$(az functionapp list --query "[?tags.Service=='AuthService'].name" -o tsv | head -n 1)
          
          if [ -z "$APP_NAME" ]; then
            echo "Tag not found. Searching by name pattern 'func-dev-auth'..."
            APP_NAME=$(az functionapp list --query "[?contains(name, 'func-dev-auth')].name" -o tsv | head -n 1)
          fi
          
          if [ -z "$APP_NAME" ]; then
            echo "##vso[task.logissue type=error]Could not find Function App for AuthService. List above shows Available resources."
            exit 1
          fi
          
          echo "Successfully Found: $APP_NAME"
          echo "##vso[task.setvariable variable=DynamicAppName]$APP_NAME"
    - task: AzureFunctionApp@2
      displayName: 'Deploy to Azure'
      inputs:
        azureSubscription: $(azureSubscription)
        appType: 'functionAppLinux'
        appName: $(DynamicAppName)
        package: '$(Pipeline.Workspace)/AuthService_Pkg/AuthService'

