trigger:
  branches:
    include: [main]
  paths:
    include:
    - infrastructure/terraform/**

variables:
- group: StayHere-Variables

stages:
- stage: TerraformPlan
  jobs:
  - job: Plan
    pool: { vmImage: 'ubuntu-latest' }
    timeoutInMinutes: 60
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Latest Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
        backendServiceArm: 'Azure-StayHere-Conn'
        backendAzureRmResourceGroupName: 'rg-terraform-mgmt'
        backendAzureRmStorageAccountName: 'ststayheretfstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'


    # ------------------------------------------------------------------
    # Build pipeline.auto.tfvars.json from the StayHere-Variables group.
    # Convention: every env var prefixed TFV_ maps to the lowercase
    # Terraform variable of the same name (TFV_GROQ_API_KEY -> groq_api_key).
    # To add a new variable: add it to the variable group, add ONE line
    # below, and declare it in infrastructure/terraform/variables.tf.
    # Empty or undefined group vars are skipped so Terraform defaults apply.
    # ------------------------------------------------------------------
    - bash: |
        set -euo pipefail
        OUT="$(System.DefaultWorkingDirectory)/infrastructure/terraform/pipeline.auto.tfvars.json"
        JSON='{}'
        while IFS='=' read -r NAME _; do
          VALUE="${!NAME}"
          TF_NAME=$(echo "${NAME#TFV_}" | tr '[:upper:]' '[:lower:]')
          # Azure DevOps leaves undefined macros as the literal '$(NAME)'
          if [ -z "$VALUE" ] || [[ "$VALUE" == \$\(*\) ]]; then
            echo "  - $TF_NAME: not set in variable group (using Terraform default)"
            continue
          fi
          JSON=$(jq --arg k "$TF_NAME" --arg v "$VALUE" '. + {($k): $v}' <<< "$JSON")
          echo "  + $TF_NAME"
        done < <(env | grep -E '^TFV_[A-Z0-9_]+=' | sort)
        echo "$JSON" > "$OUT"
        echo "Wrote $(jq 'length' "$OUT") variables to pipeline.auto.tfvars.json"
      displayName: 'Generate Terraform Variables from Variable Group'
      env:
        # --- MongoDB Atlas ---
        TFV_MONGODB_ATLAS_PUBLIC_KEY: $(MONGODB_ATLAS_PUBLIC_KEY)
        TFV_MONGODB_ATLAS_PRIVATE_KEY: $(MONGODB_ATLAS_PRIVATE_KEY)
        TFV_MONGODB_ATLAS_ORG_ID: $(MONGODB_ATLAS_ORG_ID)
        # --- Auth / platform ---
        TFV_SKIP_AUTH: $(SKIP_AUTH)
        TFV_JWT_SECRET: $(JWT_SECRET)
        TFV_APP_MODE: $(APP_MODE)
        TFV_SEED_ADMIN_ENABLED: $(SEED_ADMIN_ENABLED)
        TFV_SEED_ADMIN_USER_ID: $(SEED_ADMIN_USER_ID)
        TFV_SEED_ADMIN_EMAIL: $(SEED_ADMIN_EMAIL)
        TFV_SEED_ADMIN_PHONE: $(SEED_ADMIN_PHONE)
        TFV_SEED_ADMIN_FULL_NAME: $(SEED_ADMIN_FULL_NAME)
        # --- AI: chat, embeddings, floor plan, places ---
        TFV_GROQ_API_KEY: $(GROQ_API_KEY)
        TFV_GROQ_MODEL: $(GROQ_MODEL)
        TFV_GROQ_FLOOR_PLAN_MODEL: $(GROQ_FLOOR_PLAN_MODEL)
        TFV_GOOGLE_API_KEY: $(GOOGLE_API_KEY)
        TFV_GOOGLE_EMBEDDING_MODEL: $(GOOGLE_EMBEDDING_MODEL)
        TFV_GOOGLE_FLOOR_PLAN_MODEL: $(GOOGLE_FLOOR_PLAN_MODEL)
        TFV_GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
        TFV_ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        TFV_ANTHROPIC_FLOOR_PLAN_MODEL: $(ANTHROPIC_FLOOR_PLAN_MODEL)
        TFV_FLOOR_PLAN_PROVIDER_ORDER: $(FLOOR_PLAN_PROVIDER_ORDER)
        # --- OnFon SMS ---
        TFV_ONFON_CLIENT_ID: $(ONFON_CLIENT_ID)
        TFV_ONFON_API_KEY: $(ONFON_API_KEY)
        TFV_ONFON_BASE_URL: $(ONFON_BASE_URL)
        TFV_ONFON_SENDER_ID: $(ONFON_SENDER_ID)
        # --- M-Pesa ---
        TFV_MPESA_CONSUMER_KEY: $(MPESA_CONSUMER_KEY)
        TFV_MPESA_CONSUMER_SECRET: $(MPESA_CONSUMER_SECRET)
        TFV_MPESA_PASSKEY: $(MPESA_PASSKEY)
        TFV_MPESA_SHORTCODE: $(MPESA_SHORTCODE)
        TFV_MPESA_ENVIRONMENT: $(MPESA_ENVIRONMENT)
        # --- Cloudflare R2 ---
        TFV_R2_ACCOUNT_ID: $(R2_ACCOUNT_ID)
        TFV_R2_ACCESS_KEY_ID: $(R2_ACCESS_KEY_ID)
        TFV_R2_SECRET_ACCESS_KEY: $(R2_SECRET_ACCESS_KEY)
        TFV_R2_BUCKET_NAME: $(R2_BUCKET_NAME)
        TFV_R2_PUBLIC_BASE_URL: $(R2_PUBLIC_BASE_URL)

    - task: TerraformTask@5
      name: terraformPlan
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
        # Variables are loaded automatically from pipeline.auto.tfvars.json
        commandOptions: '-out tfplan'
        environmentServiceNameAzureRM: 'Azure-StayHere-Conn'

    - bash: rm -f "$(System.DefaultWorkingDirectory)/infrastructure/terraform/pipeline.auto.tfvars.json"
      displayName: 'Remove Generated tfvars (contains secrets)'
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/infrastructure/terraform/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  dependsOn: TerraformPlan
  condition: and(succeeded('TerraformPlan'), eq(dependencies.TerraformPlan.outputs['Plan.terraformPlan.changesPresent'], 'true'))
  jobs:
  - deployment: Apply
    pool: { vmImage: 'ubuntu-latest' }
    environment: 'production'
    timeoutInMinutes: 120
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Latest Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
              backendServiceArm: 'Azure-StayHere-Conn'
              backendAzureRmResourceGroupName: 'rg-terraform-mgmt'
              backendAzureRmStorageAccountName: 'ststayheretfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
              commandOptions: 'tfplan'
              environmentServiceNameAzureRM: 'Azure-StayHere-Conn'