trigger:
  branches:
    include: [main]
  paths:
    include:
    - infrastructure/terraform/**

variables:
- group: StayHere-Variables

stages:
- stage: TerraformPlan
  jobs:
  - job: Plan
    pool: { vmImage: 'ubuntu-latest' }
    timeoutInMinutes: 60
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Latest Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
        backendServiceArm: 'Azure-StayHere-Conn'
        backendAzureRmResourceGroupName: 'rg-terraform-mgmt'
        backendAzureRmStorageAccountName: 'ststayheretfstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'


    - task: TerraformTask@5
      name: terraformPlan
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
        commandOptions: >-
          -out tfplan
          -var="mongodb_atlas_public_key=$(MONGODB_ATLAS_PUBLIC_KEY)"
          -var="mongodb_atlas_private_key=$(MONGODB_ATLAS_PRIVATE_KEY)"
          -var="mongodb_atlas_org_id=$(MONGODB_ATLAS_ORG_ID)"
          -var="skip_auth=$(SKIP_AUTH)"
          -var="groq_api_key=$(GROQ_API_KEY)"
          -var="google_api_key=$(GOOGLE_API_KEY)"
          -var="groq_model=$(GROQ_MODEL)"
          -var="google_embedding_model=$(GOOGLE_EMBEDDING_MODEL)"
          -var="onfon_client_id=$(ONFON_CLIENT_ID)"
          -var="onfon_api_key=$(ONFON_API_KEY)"
          -var="onfon_base_url=$(ONFON_BASE_URL)"
          -var="onfon_sender_id=$(ONFON_SENDER_ID)"
          -var="mpesa_consumer_key=$(MPESA_CONSUMER_KEY)"
          -var="mpesa_consumer_secret=$(MPESA_CONSUMER_SECRET)"
          -var="mpesa_passkey=$(MPESA_PASSKEY)"
          -var="mpesa_shortcode=$(MPESA_SHORTCODE)"
          -var="mpesa_environment=$(MPESA_ENVIRONMENT)"
          -var="r2_account_id=$(R2_ACCOUNT_ID)"
          -var="r2_access_key_id=$(R2_ACCESS_KEY_ID)"
          -var="r2_secret_access_key=$(R2_SECRET_ACCESS_KEY)"
          -var="r2_bucket_name=$(R2_BUCKET_NAME)"
          -var="r2_public_base_url=$(R2_PUBLIC_BASE_URL)"
        environmentServiceNameAzureRM: 'Azure-StayHere-Conn'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/infrastructure/terraform/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  dependsOn: TerraformPlan
  condition: and(succeeded('TerraformPlan'), eq(dependencies.TerraformPlan.outputs['Plan.terraformPlan.changesPresent'], 'true'))
  jobs:
  - deployment: Apply
    pool: { vmImage: 'ubuntu-latest' }
    environment: 'production'
    timeoutInMinutes: 120
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Latest Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
              backendServiceArm: 'Azure-StayHere-Conn'
              backendAzureRmResourceGroupName: 'rg-terraform-mgmt'
              backendAzureRmStorageAccountName: 'ststayheretfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform'
              commandOptions: 'tfplan'
              environmentServiceNameAzureRM: 'Azure-StayHere-Conn'